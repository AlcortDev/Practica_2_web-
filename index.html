<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tiendita
    </title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Mi Tiendita</h1>
            <nav>
                <ul class="nav-links">
                    <li class="elemento1"><a href="Inicio">Inicio</a></li>
                    <li class="elemento2"><a href="Categoría">Categoría</a></li>
                    <li class="elemento3"><a href="Nosotros">Nosotros</a></li>
                    <li class="elemento4"><a href="Contacto">Contacto</a></li>
                    <li class="elemento5"><a href="Favoritos">Favoritos</a></li>
                    <li class="elemento5"><a href="Carrito">Carrito</a></li>
                </ul>
            </nav>
        </div>
    </header>



    <section id="inicio">
        <div class="slider">
            <div class="slide active">
                <img src="img/banner1.jpg" alt="Promocion1">
            </div>

            <div class="slide">
                <img src="img/banner2.jpg" alt="Promocion2">
            </div>

            <div class="slide">
                <img src="img/banner3.jpg" alt="Promocion3">
            </div>
            <button class="prev" onclick="ChangeSlide(-1)">&#10094</button>
            <button class="next" onclick="ChangeSlide(1)">&#10095</button>


        </div>
    </section>

    <section id="categorias" class="container">
        <h2>Categorías</h2>
            <div class="category-grid">

                <div class="category-card" data-category="Playera">
                    <img src="img/Playera2.jpg" alt="Playera">
                    <h3>Playeras</h3>
                </div>

                <div class="category-card" data-category="Sudadera">
                    <img src="img/Sudadera1.jpg" alt="Sudadera">
                    <h3>Sudaderas</h3>
                </div>

                <div class="category-card" data-category="Chaqueta">
                    <img src="img/Chaqueta1.jpg" alt="Chaqueta">
                    <h3>Chaquetas</h3>
                </div>
                
                <div class="category-card" data-category="Cardigan">
                    <img src="img/Cardigan1.jpg" alt="Cardigan">
                    <h3>Cardigan</h3>
                </div>

                <div class="category-card" data-categry="Rompevientos">
                    <img src="img/Rompevientos1.jpg" alt="Rompevientos">
                    <h3>Rompevientos</h3>
                </div>

            </div>
    </section>


    <section id="Productos" class="container">
        <h2>Productos</h2>
        <div id="product-list" class="product-grid"></div>
    </section>

    <section id="Nosotros" class="container">
        <h2>Nosotros</h2>
        <p>Lorem ipsum dolor sit amet.</p>
    </section>

    <section id="Contacto" class="container">
        <h2>Contacto</h2>
        <p>Whatsapp: <a href="http://wa.me/524437070458">+52 443 707 0458</a></p>
    </section>
